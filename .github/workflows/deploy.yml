# Disabled on purpose: manual start only, and it will not work until the two
# prerequisites below are done. Nothing here runs by itself.
#
# 1. Pulumi state currently lives on a laptop (`pulumi login --local`, file://~).
#    CI cannot see it. Move it to a bucket first:
#      gsutil mb -l europe-west1 gs://team3-507508-quizly-state
#      pulumi stack export --file dev.json
#      pulumi login gs://team3-507508-quizly-state && pulumi stack init dev
#      pulumi stack import --file dev.json
#
# 2. Repository secrets:
#      GCP_WORKLOAD_IDENTITY_PROVIDER  projects/994382662011/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#      GCP_SERVICE_ACCOUNT             deployer SA email, needs roles/run.admin,
#                                      artifactregistry.writer, aiplatform.admin,
#                                      discoveryengine.admin, storage.admin
#      PULUMI_CONFIG_PASSPHRASE        the stack passphrase
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm
        required: true
        default: ""

permissions:
  contents: read
  id-token: write # for Workload Identity Federation

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulumi/package-lock.json
      - run: npm ci
        working-directory: pulumi

      # Builds both images and rolls out agent, backend and frontend.
      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: pulumi
          # cloud-url: gs://team3-507508-quizly-state   # uncomment after step 1
