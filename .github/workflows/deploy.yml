# Disabled on purpose: manual start only. Nothing here runs by itself.
#
# State lives in pulumi/.pulumi/ in this repo, so a run that changes anything
# must commit the updated state back, otherwise the next run works from a stale
# copy. The step at the end does that.
#
# Secrets, all already set: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT,
# PULUMI_CONFIG_PASSPHRASE. The deployer SA and the federation are defined in
# pulumi/index.ts.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm
        required: true
        default: ""

permissions:
  contents: write # to commit the updated Pulumi state back
  id-token: write # for Workload Identity Federation

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulumi/package-lock.json
      - run: npm ci
        working-directory: pulumi

      # Builds both images and rolls out agent, backend and frontend.
      # The backend url comes from pulumi/Pulumi.yaml: the state in this repo.
      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: pulumi

      - name: Commit updated state
        run: |
          git add pulumi/.pulumi
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(state): pulumi up from ${GITHUB_SHA::7}"
          git push
